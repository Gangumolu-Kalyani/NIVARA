spring.application.name=nivara-backend

# Optionally load local secrets from a git-ignored .env file (KEY=VALUE lines).
spring.config.import=optional:file:.env[.properties]

# PostgreSQL connection - values come from environment variables (or .env).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/nivara}
spring.datasource.username=${DB_USERNAME:nivara_app}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
# validate: Hibernate never creates or alters tables; schema changes stay deliberate.
spring.jpa.hibernate.ddl-auto=validate
# Close the DB session when the service layer finishes, not after the HTTP response.
spring.jpa.open-in-view=false

# JWT access tokens (HS256), issued at login and required by every endpoint except
# /api/health, /api/auth/register and /api/auth/login.
# JWT_SECRET has deliberately no default: without it the application refuses to start, rather
# than sign tokens with a key anybody could know. Use at least 32 random bytes.
nivara.security.jwt.secret=${JWT_SECRET}
nivara.security.jwt.ttl=PT60M

# Browser origins allowed to call the API (comma-separated). The default is the Vite dev server.
nivara.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Daily Assistance reminders: how often an unanswered reminder is repeated, and how often the
# scheduler runs. After escalateAfterMissed unanswered nudges the care team is alerted.
nivara.reminders.nudge-interval=PT15M
nivara.reminders.scheduler.delay=PT1M

# Assistant language model. The default provider, placeholder, needs no key and makes no network
# calls. For OpenRouter set LLM_PROVIDER=openrouter and OPENROUTER_API_KEY (environment or .env,
# never committed). The key is sent only to the base URL below, which must be https.
nivara.assistant.llm.provider=${LLM_PROVIDER:placeholder}
nivara.assistant.llm.base-url=${LLM_BASE_URL:https://openrouter.ai/api/v1}
# openrouter/free lets OpenRouter pick a free model that supports tool calling, per request.
nivara.assistant.llm.model=${LLM_MODEL:openrouter/free}
nivara.assistant.llm.api-key=${OPENROUTER_API_KEY:}
nivara.assistant.llm.connect-timeout=PT5S
nivara.assistant.llm.request-timeout=PT30S
nivara.assistant.llm.exchange-timeout=PT60S
nivara.assistant.llm.retry-backoff=PT1S
nivara.assistant.llm.max-rounds=4
nivara.assistant.llm.max-tool-calls-per-round=5
nivara.assistant.llm.temperature=0.2
nivara.assistant.llm.max-tokens=800
