spring.application.name=nivara-backend

# Optionally load local secrets from a git-ignored .env file (KEY=VALUE lines).
spring.config.import=optional:file:.env[.properties]

# PostgreSQL connection - values come from environment variables (or .env).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/nivara}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
# validate: Hibernate never creates or alters tables; schema changes stay deliberate.
spring.jpa.hibernate.ddl-auto=validate
# Close the DB session when the service layer finishes, not after the HTTP response.
spring.jpa.open-in-view=false
