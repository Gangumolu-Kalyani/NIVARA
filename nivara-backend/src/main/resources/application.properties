spring.application.name=nivara-backend

# Optionally load local secrets from a git-ignored .env file (KEY=VALUE lines).
spring.config.import=optional:file:.env[.properties]

# PostgreSQL connection - values come from environment variables (or .env).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/nivara}
spring.datasource.username=${DB_USERNAME:nivara_app}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
# validate: Hibernate never creates or alters tables; schema changes stay deliberate.
spring.jpa.hibernate.ddl-auto=validate
# Close the DB session when the service layer finishes, not after the HTTP response.
spring.jpa.open-in-view=false

# Development stand-in for the authenticated principal, read by DevelopmentCurrentUserProvider.
# Server-side only: it is never part of the HTTP contract, and no client can choose the acting
# account. Empty means "no caller", so POST /api/patients answers 503 until it is set.
# Remove this property once Spring Security supplies the principal.
nivara.security.development-user-uuid=${DEV_USER_UUID:}
